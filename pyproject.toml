[project]
name = "egglog-benchmarks"
version = "0.1.0"
description = "Benchmark harness for the egglog system paper"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[project.scripts]
bench = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
