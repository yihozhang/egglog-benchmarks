description = "Datalog workloads from flowlog-bench (the pairs FlowLog and Souffle finish within 60 s): egglog at 1-32 threads, egglog 0.5.0, FlowLog, Souffle."
benchmarks = ["datalog"]
threads = [1]
reps = 3
timeout = 600       # seconds per run
memory_gb = 32      # per run
plot = "bars"
baseline = "egglog"

