description = "Datalog workloads from flowlog-bench (the pairs FlowLog and Souffle finish within 60 s): egglog at 1-32 threads, egglog 0.5.0, FlowLog, Souffle."
benchmarks = ["datalog"]
threads = [1]
reps = 3
timeout = 600       # seconds per run
memory_gb = 32      # per run
plot = "bars"
baseline = "egglog"

[[variants]]
label = "egglog"
system = "egglog"
ref = "593df10e"

[[variants]]
label = "egglog-t4"
system = "egglog"
ref = "593df10e"
threads = [4]

[[variants]]
label = "egglog-t8"
system = "egglog"
ref = "593df10e"
threads = [8]

[[variants]]
label = "egglog-t16"
system = "egglog"
ref = "593df10e"
threads = [16]

[[variants]]
label = "egglog-t32"
system = "egglog"
ref = "593df10e"
threads = [32]

[[variants]]
label = "egglog-no-decomp"
system = "egglog"
ref = "593df10e"
flags = ["--no-decomp"]      # single-bag plans (only matters for rules with 3+ atoms)

[[variants]]
label = "egglog-no-decomp-t8"
system = "egglog"
ref = "593df10e"
flags = ["--no-decomp"]
threads = [8]

[[variants]]
label = "egglog-0.5.0"
system = "egglog"
ref = "v0.5.0"

[[variants]]
label = "flowlog"
system = "flowlog"
ref = "flowlog-compiler-v0.7.0"   # latest release (2026-09-24)

[[variants]]
label = "flowlog-t4"
system = "flowlog"
ref = "flowlog-compiler-v0.7.0"   # latest release (2026-09-24)
threads = [4]

[[variants]]
label = "flowlog-t8"
system = "flowlog"
ref = "flowlog-compiler-v0.7.0"   # latest release (2026-09-24)
threads = [8]

[[variants]]
label = "flowlog-t16"
system = "flowlog"
ref = "flowlog-compiler-v0.7.0"   # latest release (2026-09-24)
threads = [16]

[[variants]]
label = "flowlog-t32"
system = "flowlog"
ref = "flowlog-compiler-v0.7.0"   # latest release (2026-09-24)
threads = [32]

[[variants]]
label = "souffle"
system = "souffle"
ref = "2.5"                    # latest release (.deb); no cc/sssp ports (recursive min aggregates)

[[variants]]
label = "souffle-t4"
system = "souffle"
ref = "2.5"                    # latest release (.deb); no cc/sssp ports (recursive min aggregates)
