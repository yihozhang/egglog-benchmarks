description = "End-to-end single-threaded running time of egglog against the original egglog prototype."
benchmarks = ["math", "math-microbenchmark", "actions", "eggcc", "hardboiled", "pointer-analysis", "luminal"]
threads = [1]
reps = 3
timeout = 600       # seconds per run
memory_gb = 32      # per run; cgroup MemoryMax via systemd-run
plot = "bars"
baseline = "egglog-0.5.0"   # speedups are reported relative to this variant

[[variants]]
label = "egglog"
system = "egglog"
ref = "593df10e"             # egglog main as of 2026-10-09; move this pin deliberately

[[variants]]
label = "egglog-0.5.0"
system = "egglog"
ref = "v0.5.0"
