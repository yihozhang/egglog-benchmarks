description = "Multi-threaded scaling of egglog, pinned to the 64 physical cores (SMT siblings are 64-127)."
benchmarks = ["math", "math-microbenchmark", "actions", "eggcc", "hardboiled", "pointer-analysis", "luminal"]
threads = [1, 2, 4, 8, 16, 32, 64]
cpus = "0-63"
reps = 3
timeout = 600       # seconds per run
memory_gb = 32      # per run; cgroup MemoryMax via systemd-run
plot = "scaling"
baseline = "egglog"

[[variants]]
label = "egglog"
system = "egglog"
ref = "593df10e"             # egglog main as of 2026-10-09; move this pin deliberately
