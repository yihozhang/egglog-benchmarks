description = "Ablation: tree decomposition in query planning and dynamic variable ordering during query execution."
# --no-dynamic-order comes from systems/egglog/patches/no-dynamic-order.patch, applied at build time.
benchmarks = ["math", "actions", "eggcc", "hardboiled", "pointer-analysis"]
threads = [1]
reps = 3
timeout = 600       # seconds per run
memory_gb = 32      # per run; cgroup MemoryMax via systemd-run
plot = "bars"
baseline = "egglog"         # slowdowns relative to the full system

[[variants]]
label = "egglog"
system = "egglog"
ref = "593df10e"             # egglog main as of 2026-10-09; move this pin deliberately
patches = ["no-dynamic-order"]

[[variants]]
label = "no-decomp"
system = "egglog"
ref = "593df10e"             # egglog main as of 2026-10-09; move this pin deliberately
patches = ["no-dynamic-order"]
flags = ["--no-decomp"]

[[variants]]
label = "no-dynamic-order"
system = "egglog"
ref = "593df10e"             # egglog main as of 2026-10-09; move this pin deliberately
patches = ["no-dynamic-order"]
flags = ["--no-dynamic-order"]

[[variants]]
label = "no-decomp-no-dynamic-order"
system = "egglog"
ref = "593df10e"             # egglog main as of 2026-10-09; move this pin deliberately
patches = ["no-dynamic-order"]
flags = ["--no-decomp", "--no-dynamic-order"]
