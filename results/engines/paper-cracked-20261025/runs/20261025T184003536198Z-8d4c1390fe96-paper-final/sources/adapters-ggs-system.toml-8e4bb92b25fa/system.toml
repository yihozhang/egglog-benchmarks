# ggs (https://github.com/kchanqvq/ggs), the Common Lisp equality-saturation engine in its
# eqsat/ directory (ASDF system ggs/eqsat), run in a container (see systems/_container/README.md).
# A benchmark is supported when a port benchmarks/<suite>/ggs/<name>.lisp exists; the image
# compiles each port with SBCL into a standalone executable with ggs/eqsat preloaded.
port_dir = "ggs"
repo = "https://github.com/kchanqvq/ggs"
container = true

notes = """
Common Lisp port (benchmarks/<suite>/ggs/<name>.lisp) of the ggs/eqsat system (directory
eqsat/ of the repo; ggs/stochastic is a different, tree-based search and is not used). Pin:
master 2ad09810 (no tags); the only non-Quicklisp dependency, lp-hash-table, is pinned too.
The engine's own driver run-rewrites :max-iter N is used: per iteration every rule is
matched against the index built by the previous rebuild, RHS interned and merged, then one
rebuild; no match limit (BackoffScheduler off), no :prune-constant, no analysis, no
extraction. Compiled natively with (speed 3) (safety 0) into a standalone SBCL executable
(ggs/eqsat preloaded), so wall_s = the executable (core start ~0.08 s, start terms, N
iterations, size count); report.run_s = run-rewrites only. The eqsat engine is
single-threaded (only ggs/stochastic has worker threads).
Saturating suites (horner, matmul-assoc; one port per suite, --instance N): run-rewrites's
own stop rule is used, :saturate when an iteration (match, apply, rebuild) leaves the
e-node and e-class counts unchanged; that final iteration counts, as in egglog, and the
counts agree with egglog/egg/oatlog on every instance (e.g. horner-5 8, horner-9 10,
matmul-assoc-160 9 iterations). run-rewrites returns only the stop reason, so the port
calls it with :max-iter 1 per iteration until it returns :saturate (loop body and stop
check are the engine's, unchanged; measured against one call with a large :max-iter the
difference is within noise, <1% on horner-9 and matmul-assoc-320). Atoms are 0-ary
function symbols: (Var "a") is the symbol A, (Zero) the symbol ZERO; (Mat 10 10) is MAT
over the e-class of the integer 10, which is a ggs e-node/e-class that egglog has no table
for and is not counted (like egg's i64 leaves).
"""
