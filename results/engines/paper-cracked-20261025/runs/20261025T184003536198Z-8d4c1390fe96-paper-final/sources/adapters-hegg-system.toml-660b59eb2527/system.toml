# hegg (https://github.com/alt-romes/hegg): e-graphs and equality saturation in Haskell.
# Container-based system (see systems/_container/README.md): `build <ref>` builds the image
# egglog-bench/hegg:<commit12> with hegg checked out at <ref> and every port under
# benchmarks/<suite>/hegg/ compiled against it (a cabal package per suite, GHC -O2).
# A benchmark is supported when benchmarks/<suite>/hegg/<name>.cabal exists.
port_dir = "hegg"
repo = "https://github.com/alt-romes/hegg"
container = true

notes = """
Haskell port (benchmarks/<suite>/hegg/Main.hs) against hegg v0.5.0.0 (GHC 9.6, -O2, -A32m).
hegg's own driver (runEqualitySaturation) hard-codes a 30-iteration cap, stops at
saturation and bans rules through a BackoffScheduler, so the port drives the iterations
itself from hegg's building blocks: per iteration build the e-matching database, ematch every
rule, apply every match, rebuild once. Two hegg quirks handled in the port: (1) hegg builds
the e-matching database from the hashcons without canonicalizing stored e-class ids, which
loses matches after cascading merges (sizes diverged from egglog at iteration 5), so the port
builds the same database over canonical ids; (2) ematch returns each substitution of a
k-atom pattern k times, applying duplicates is idempotent and kept as hegg does it. The
trivial () analysis, no extraction. wall_s = the whole port process; the port forces
evaluation at every iteration so laziness cannot defer work past the end. Single-threaded.
Saturating suites (horner, matmul-assoc; one port per suite taking --instance N): the same
loop runs until an iteration adds no e-node and merges no two e-classes, detected on the
e-graph after the matches were applied and before the rebuild (hegg's add/merge return the
e-graph untouched when the node exists / the ids share a root, so the hashcons size and the
e-class count move iff something changed); the final no-change iteration counts, as in
egglog. Iteration counts and sizes agree with egglog/egg/oatlog on every instance. In the
matmul-assoc port (Mat 10 10) is a nullary leaf (its arguments are always 10, 10; egglog
does not count i64 literals as e-nodes either), so hegg reports one e-class fewer than
egg, which has a Num(10) e-class.
"""
