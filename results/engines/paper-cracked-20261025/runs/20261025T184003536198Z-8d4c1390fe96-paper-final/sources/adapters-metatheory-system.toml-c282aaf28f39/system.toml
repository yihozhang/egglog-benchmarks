# Metatheory.jl (https://github.com/JuliaSymbolics/Metatheory.jl), an e-graph library in Julia,
# run inside a container (see systems/_container/README.md). A benchmark is supported when a
# Julia script benchmarks/<suite>/metatheory/<name>.jl exists; entry.sh runs it with the
# project that has the requested Metatheory.jl commit developed and precompiled.
port_dir = "metatheory"
repo = "https://github.com/JuliaSymbolics/Metatheory.jl"
container = true

notes = """
Julia port (benchmarks/<suite>/metatheory/<name>.jl) against Metatheory.jl v2.0.2, the
latest release (no 3.x release exists; master is an unreleased 2.1.0). saturate! with
SaturationParams(timeout = N iterations, SimpleScheduler, eclasslimit = 0, enodelimit =
typemax, timelimit = 0, no goal), heads are plain call terms (Add, Const, Var, ...) so no
Julia arithmetic or constant folding applies. wall_s = measured by the port after a JIT
warm-up (a 3-iteration saturate! on a separate e-graph): start e-graph + saturate! + size
count; Julia startup, package load and JIT are excluded (Base.cumulative_compile_time_ns
confirms 0 s of compilation inside the timed region). report.run_s = saturate! only. Node
counts are computed by the port because Metatheory's hashcons keeps stale entries after
rebuild. Literals (-1, 1, 2, 3, 7, "x", "y", "five") are e-classes of their own in
Metatheory (+8 e-classes vs egglog). Single-threaded.

Saturating suites (horner, matmul-assoc; one port per suite taking --instance N): the same
saturate! call with timeout = 100000 iterations, stopped by Metatheory's own saturation
check. Its reason :saturated fires after an iteration whose rule applications performed no
merge (isempty(g.dirty) before the rebuild); a new e-node is a singleton class merged with
the matched class, so this is exactly egglog's "no new e-node, no merge" iteration, and
Metatheory counts it in report.iterations like egglog counts the final no-change run:
iteration counts and e-node counts match egglog/egg on every instance (horner 5-9, matmul
20-320). The warm-up is a smaller instance of the same suite saturated to completion on a
separate e-graph (degree min(N, 4), chain min(N, 10)); it compiles every code path used
later (0 s of compilation inside the timed region). Literal classes: the Var strings
("a", "b", ..., "x") for horner, the i64 10 of Mat for matmul-assoc, +n+2 / +1 e-classes vs
egglog. Metatheory e-matches every pattern against every e-class (cached_ids returns all
classes, there is no index by head), which is why its saturation times grow much faster
with the instance than egg's.
"""
