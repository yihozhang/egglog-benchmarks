# egglog runs the .egg benchmark programs directly, so every benchmark is supported.

notes = """
Runs the .egg programs directly with `egglog [-j N] [-F dir] <program> <trailer>`; the trailer
adds (print-size) and (print-stats). wall_s = the egglog process (parsing, type checking, the
schedule, printing sizes/stats); report.run_s = sum of egglog's own per-ruleset
search/merge/rebuild times (reference only). egglog 0.5.0 has no -j, so threads > 1 are
unsupported for it. Local modifications are patches in patches/ (e.g. --no-dynamic-order).
"""
