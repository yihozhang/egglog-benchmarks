# Query-only comparison (experiments with kind = "query", harness/query.py). Not a regular
# adapter: `build <ref>` builds driver/ against egglog at <ref>; run_suite.py and bench_db.py
# do the work.

notes = """
Snapshot = final state of each program, exported via the Rust API (driver export); loading excluded.
Each rule becomes one query: in egglog a :naive ruleset with the rule, its RHS replaced by
(set (R_<q> vars...) 1) on a (function R_<q> (...) i64 :no-merge), run once; in SQL
INSERT INTO a temp table SELECT DISTINCT over tables with the functional dependency as PRIMARY KEY.
egglog: execute = search+apply+merge of that ruleset from RunReport (rebuild excluded);
  optimize = the rest of the driver's wall time for the test (parse, typecheck, rule compilation).
  The paper configuration uses only --no-decomp, set before program setup for
  both snapshot export and query execution.
DuckDB 1.5.6: optimize = planner + optimizers + physical planner from its profiler; execute =
  profiler latency - optimize (latency matches our wall clock within 0.1-0.6 ms). Prepared
  statements re-plan on EXECUTE, so ad-hoc INSERT is timed.
Umbra (umbradb/umbra:latest, container): optimize = PREPARE (planning + code generation),
  execute = EXECUTE (Umbra logs 0.03 ms compilation, i.e. no re-planning); our wall clock.
  PREPARE is timed once; EXECUTE and the ad-hoc reference use one warmup then
  the median of --reps runs. Egglog uses one pass and DuckDB uses one warmup
  then --reps profiled runs.
  About 16 distinct rules crash the server (reduced repro in umbra-repro/); crashes are recorded
  as status "crash" and the tables reloaded.
Rows of every query are compared across engines by `bench check`.
"""
