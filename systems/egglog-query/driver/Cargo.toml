[package]
name = "egglog-query-driver"
version = "0.0.0"
edition = "2024"

# Path dependencies are rewritten by systems/egglog-query/build to the requested egglog checkout.
[dependencies]
egglog = { path = "EGGLOG_SRC" }
egglog-reports = { path = "EGGLOG_SRC/egglog-reports" }
egglog-numeric-id = { path = "EGGLOG_SRC/numeric-id" }
serde_json = "1"

[profile.release]
debug = false
